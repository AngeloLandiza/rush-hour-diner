name: Publish

# Builds the place and publishes it through Open Cloud on every push to main.
# Disabled until the repo variable PUBLISH_ENABLED is "true" and these are set:
#   vars.ROBLOX_UNIVERSE_ID, vars.ROBLOX_PLACE_ID, secrets.ROBLOX_API_KEY (Place Publishing permission)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit and tools
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: "true"

      - name: Full checks (never publish a red build)
        run: ./tools/check.sh

      - name: Publish place version
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ROBLOX_API_KEY" ] || [ -z "$UNIVERSE_ID" ] || [ -z "$PLACE_ID" ]; then
            echo "::error::ROBLOX_API_KEY, ROBLOX_UNIVERSE_ID or ROBLOX_PLACE_ID is not set"
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @place.rbxl)
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Publish failed with HTTP $status"
            exit 1
          fi
